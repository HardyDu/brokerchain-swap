server {
    listen 80;
    listen [::]:80;
    server_name swap-api.broker-chain.com;
    server_tokens off;
    client_max_body_size 1k;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /api/swap/reserves {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088/api/swap/reserves;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /api/swap/quote {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088/api/swap/quote;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /api/liquidity/pool {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088/api/liquidity/pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /api/liquidity/quote {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8088/api/liquidity/quote;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location / {
        return 404;
    }
}
